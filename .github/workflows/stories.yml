name: Stories Instagram

# 2 stories par jour, en fin de journee (pic de consultation des stories).
on:
  schedule:
    - cron: "30 21 * * *"      # vise 17 h 30 Martinique (GitHub decale de 15-30 min)
  workflow_dispatch:

jobs:
  stories:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Reconstituer la configuration
        run: |
          cat > .env <<CONF
          IG_APP_ID=${{ secrets.IG_APP_ID }}
          IG_APP_SECRET=${{ secrets.IG_APP_SECRET }}
          IG_LONG_TOKEN=${{ secrets.IG_LONG_TOKEN }}
          IG_USER_ID=${{ secrets.IG_USER_ID }}
          MEDIA_PUBLIC_BASE_URL=https://raw.githubusercontent.com/${{ github.repository }}/main
          GRAPH_VERSION=v23.0
          CONF

      - name: Publier les 2 prochaines stories
        run: node publish-next-stories.mjs 2

      - name: Enregistrer l'avancement de la file
        run: |
          rm -f .env
          if [ -n "$(git status --porcelain queue-stories.json)" ]; then
            git config user.name  "IRC Publication"
            git config user.email "contact@ircsolution.fr"
            git add queue-stories.json
            git commit -m "Stories du jour"
            git push
          fi
